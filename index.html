<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SaludStock · Escáner</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#eef4fb;
      color:#12345b;
    }

    .wrap{
      width:min(94%,520px);
      margin:0 auto;
      padding:28px 0 44px;
    }

    .brand{
      text-align:center;
      margin-bottom:18px;
    }

    .brand h1{
      margin:0;
      font-size:30px;
      color:#16477c;
    }

    .brand p{
      margin:5px 0 0;
      color:#6b7f98;
    }

    .card{
      background:#fff;
      border:1px solid #d3dfec;
      border-radius:18px;
      padding:20px;
      box-shadow:0 10px 28px rgba(36,73,112,.08);
    }

    button{
      width:100%;
      border:0;
      border-radius:10px;
      padding:14px;
      margin-top:12px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      min-height:48px;
    }

    button:disabled{
      cursor:not-allowed;
      opacity:.5;
    }

    .primary{
      background:#287be0;
      color:#fff;
    }

    .secondary{
      background:#e8f0fa;
      color:#174878;
    }

    .session{
      margin-bottom:12px;
      padding:12px;
      border-radius:12px;
      background:#eaf7f2;
      color:#11724e;
      text-align:center;
      font-weight:800;
    }

    #scannerBox{
      display:none;
      margin-top:16px;
    }

    #reader{
      overflow:hidden;
      border-radius:14px;
      background:#000;
    }

    #status{
      min-height:44px;
      margin-top:14px;
      text-align:center;
      font-weight:700;
      line-height:1.35;
    }

    .ok{color:#118859}
    .bad{color:#c73535}

    .hint{
      margin-top:14px;
      color:#6b7f98;
      font-size:13px;
      text-align:center;
      line-height:1.4;
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="brand">
    <h1>SaludStock</h1>
    <p>Escáner móvil de códigos de barras</p>
  </div>

  <div class="card">

    <div id="pairedInfo" class="session">
      Conectando con SaludStock…
    </div>

    <button class="primary" id="connectBtn">
      Abrir cámara
    </button>

    <div id="scannerBox">
      <div id="reader"></div>

      <button class="secondary" id="stopBtn">
        Detener cámara
      </button>
    </div>

    <div id="status">
      Comprobando conexión…
    </div>

    <div class="hint">
      No tienes que escribir ningún código.
      La misma conexión sirve para todos los productos hasta que
      cierres sesión o desconectes el lector desde SaludStock.
    </div>

  </div>
</div>

<script>
const SUPABASE_URL =
  "https://dhcpgjexxodqwlktuwlg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_o6ZOZV8KktcjJei9eApATQ_l_YhyFsX";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const params =
  new URLSearchParams(window.location.search);

const hashText =
  window.location.hash.replace(/^#/, "");

const hashParams =
  new URLSearchParams(hashText);

const activeSession = (
  params.get("s") ||
  params.get("session") ||
  hashParams.get("s") ||
  hashParams.get("session") ||
  ""
).trim();

const pairedInfo =
  document.getElementById("pairedInfo");

const connectBtn =
  document.getElementById("connectBtn");

const stopBtn =
  document.getElementById("stopBtn");

const scannerBox =
  document.getElementById("scannerBox");

const statusEl =
  document.getElementById("status");

let scanner = null;
let starting = false;
let lastCode = "";
let lastSentAt = 0;
let sentCount = 0;


function setStatus(text, ok=true){
  statusEl.textContent = text;
  statusEl.className = ok ? "ok" : "bad";
}


function validSession(){
  return /^\d{6}$/.test(activeSession);
}


function setDisconnectedPage(){
  pairedInfo.textContent =
    "○ Sin conexión con la PC";

  connectBtn.disabled = true;

  setStatus(
    "Abre esta página escaneando el QR que muestra SaludStock en la PC.",
    false
  );
}


async function sendBarcode(code){
  code = String(code || "").trim();

  if(!code){
    return;
  }

  const now = Date.now();

  // Evita repetir varias veces el mismo código mientras
  // todavía está frente a la cámara.
  if(
    code === lastCode &&
    now - lastSentAt < 1800
  ){
    return;
  }

  lastCode = code;
  lastSentAt = now;

  const {data,error} = await client.rpc(
    "submit_barcode",
    {
      p_session_code: activeSession,
      p_barcode: code
    }
  );

  if(error){
    setStatus(
      "No se pudo enviar: " + error.message,
      false
    );
    return;
  }

  if(!data){
    setStatus(
      "La conexión con la PC venció o fue cerrada. Vuelve a escanear el QR de SaludStock.",
      false
    );
    return;
  }

  sentCount += 1;

  if(navigator.vibrate){
    navigator.vibrate(100);
  }

  setStatus(
    "✓ Producto #" + sentCount +
    " enviado: " + code +
    ". Puedes escanear el siguiente.",
    true
  );
}


async function startScanner(){
  if(
    !validSession() ||
    starting ||
    scanner
  ){
    return;
  }

  starting = true;
  connectBtn.disabled = true;
  scannerBox.style.display = "block";

  pairedInfo.textContent =
    "● Conectado a SaludStock";

  const formats = [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF
  ];

  scanner = new Html5Qrcode(
    "reader",
    {
      formatsToSupport: formats,
      verbose: false
    }
  );

  try{
    await scanner.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 300,
          height: 150
        },
        aspectRatio: 1.7778
      },
      decodedText => sendBarcode(decodedText),
      () => {}
    );

    setStatus(
      "Cámara lista. Escanea todos los productos que necesites.",
      true
    );

  }catch(err){

    try{
      await scanner.clear();
    }catch(_){}

    scanner = null;
    scannerBox.style.display = "none";
    connectBtn.disabled = false;

    setStatus(
      "El navegador no permitió abrir la cámara automáticamente. Pulsa «Abrir cámara» y acepta el permiso.",
      false
    );

  }finally{
    starting = false;

    if(!scanner){
      connectBtn.disabled = false;
    }
  }
}


async function stopScanner(){
  if(scanner){
    try{
      await scanner.stop();
    }catch(_){}

    try{
      await scanner.clear();
    }catch(_){}
  }

  scanner = null;
  scannerBox.style.display = "none";
  connectBtn.disabled = false;

  setStatus(
    "Cámara detenida. La conexión con SaludStock sigue activa.",
    true
  );
}


connectBtn.addEventListener(
  "click",
  startScanner
);

stopBtn.addEventListener(
  "click",
  stopScanner
);


// No hay cuadro para introducir los 6 números.
// El único modo normal de emparejar es mediante el QR de la PC.
if(!validSession()){
  setDisconnectedPage();

}else{
  pairedInfo.textContent =
    "● Conectado a SaludStock";

  setStatus(
    "Conexión recibida desde el QR. Abriendo cámara…",
    true
  );

  // Lo intentamos automáticamente. Algunos navegadores móviles
  // obligan a tocar el botón por seguridad; en ese caso queda
  // disponible como respaldo, pero nunca pide los 6 números.
  setTimeout(
    () => startScanner(),
    300
  );
}
</script>

</body>
</html>
