<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SaludStock · Escáner</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#eef4fb;
      color:#12345b;
    }
    .wrap{
      width:min(94%,520px);
      margin:0 auto;
      padding:28px 0 44px;
    }
    .brand{
      text-align:center;
      margin-bottom:18px;
    }
    .brand h1{
      margin:0;
      font-size:30px;
      color:#16477c;
    }
    .brand p{
      margin:5px 0 0;
      color:#6b7f98;
    }
    .card{
      background:#fff;
      border:1px solid #d3dfec;
      border-radius:18px;
      padding:20px;
      box-shadow:0 10px 28px rgba(36,73,112,.08);
    }
    label{
      display:block;
      font-weight:700;
      margin:0 0 7px;
    }
    input{
      width:100%;
      height:50px;
      border:1px solid #abc0d8;
      border-radius:10px;
      padding:0 14px;
      font-size:19px;
      outline:none;
    }
    input:focus{
      border-color:#2f80ed;
      box-shadow:0 0 0 3px rgba(47,128,237,.12);
    }
    button{
      width:100%;
      border:0;
      border-radius:10px;
      padding:14px;
      margin-top:12px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }
    .primary{background:#287be0;color:white}
    .green{background:#16a66a;color:white}
    .secondary{background:#e8f0fa;color:#174878}
    #scannerBox{
      display:none;
      margin-top:16px;
    }
    #reader{
      overflow:hidden;
      border-radius:14px;
      background:#000;
    }
    #status{
      min-height:24px;
      margin-top:12px;
      text-align:center;
      font-weight:700;
    }
    .ok{color:#118859}
    .bad{color:#c73535}
    .hint{
      margin-top:12px;
      color:#6b7f98;
      font-size:13px;
      text-align:center;
    }
    .manual{
      display:none;
      margin-top:18px;
      border-top:1px solid #e2e8f0;
      padding-top:16px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>SaludStock</h1>
    <p>Escáner móvil de códigos de barras</p>
  </div>

  <div class="card">
    <label for="session">Código de conexión</label>
    <input id="session" inputmode="numeric" maxlength="6" placeholder="Ej. 482193">

    <button class="primary" id="connectBtn">Conectar y abrir cámara</button>

    <div id="scannerBox">
      <div id="reader"></div>
      <button class="secondary" id="stopBtn">Detener cámara</button>
    </div>

    <div id="status">Escribe el código que muestra SaludStock en la PC.</div>

    <div class="manual" id="manualBox">
      <label for="manualCode">Código manual</label>
      <input id="manualCode" inputmode="numeric" placeholder="Escribe el código">
      <button class="green" id="sendManual">Enviar código</button>
    </div>

    <div class="hint">
      Mantén el código de barras centrado, con buena luz y sin reflejos.
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dhcpgjexxodqwlktuwlg.supabase.co";
const SUPABASE_KEY = "sb_publishable_o6ZOZV8KktcjJei9eApATQ_l_YhyFsX";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const sessionInput = document.getElementById("session");
const connectBtn = document.getElementById("connectBtn");
const stopBtn = document.getElementById("stopBtn");
const scannerBox = document.getElementById("scannerBox");
const statusEl = document.getElementById("status");
const manualBox = document.getElementById("manualBox");
const manualCode = document.getElementById("manualCode");
const sendManual = document.getElementById("sendManual");

let scanner = null;
let activeSession = "";
let lastCode = "";
let lastSentAt = 0;

function status(text, ok=true) {
  statusEl.textContent = text;
  statusEl.className = ok ? "ok" : "bad";
}

async function sendBarcode(code) {
  const now = Date.now();

  if (!code) return;

  // Evita que la cámara mande el mismo código 20 veces por segundo.
  if (code === lastCode && now - lastSentAt < 2500) return;

  lastCode = code;
  lastSentAt = now;

  const { data, error } = await client.rpc("submit_barcode", {
    p_session_code: activeSession,
    p_barcode: code
  });

  if (error) {
    status("No se pudo enviar: " + error.message, false);
    return;
  }

  if (!data) {
    status("La conexión venció. Genera un código nuevo en la PC.", false);
    return;
  }

  if (navigator.vibrate) navigator.vibrate(120);
  status("✓ Enviado a SaludStock: " + code, true);
}

async function startScanner() {
  const code = sessionInput.value.trim();

  if (!/^\d{6}$/.test(code)) {
    status("El código de conexión debe tener 6 números.", false);
    return;
  }

  activeSession = code;
  scannerBox.style.display = "block";
  manualBox.style.display = "block";
  connectBtn.disabled = true;

  scanner = new Html5Qrcode("reader");

  const formats = [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF
  ];

  try {
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 300, height: 150 },
        formatsToSupport: formats,
        aspectRatio: 1.7778
      },
      decodedText => sendBarcode(decodedText),
      () => {}
    );

    status("Cámara lista. Apunta al código de barras.", true);
  } catch (err) {
    connectBtn.disabled = false;
    status(
      "No se pudo abrir la cámara. Revisa el permiso del navegador. " +
      (err?.message || err),
      false
    );
  }
}

async function stopScanner() {
  if (scanner) {
    try { await scanner.stop(); } catch (_) {}
    try { await scanner.clear(); } catch (_) {}
  }

  scanner = null;
  scannerBox.style.display = "none";
  connectBtn.disabled = false;
  status("Cámara detenida.", true);
}

connectBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", stopScanner);

sendManual.addEventListener("click", () => {
  sendBarcode(manualCode.value.trim());
  manualCode.value = "";
  manualCode.focus();
});
</script>
</body>
</html>
