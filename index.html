<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SaludStock · Escáner</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#eef4fb;
      color:#12345b;
    }
    .wrap{
      width:min(94%,520px);
      margin:0 auto;
      padding:28px 0 44px;
    }
    .brand{text-align:center;margin-bottom:18px}
    .brand h1{margin:0;font-size:30px;color:#16477c}
    .brand p{margin:5px 0 0;color:#6b7f98}
    .card{
      background:#fff;
      border:1px solid #d3dfec;
      border-radius:18px;
      padding:20px;
      box-shadow:0 10px 28px rgba(36,73,112,.08);
    }
    label{display:block;font-weight:700;margin:0 0 7px}
    input{
      width:100%;
      height:50px;
      border:1px solid #abc0d8;
      border-radius:10px;
      padding:0 14px;
      font-size:19px;
      outline:none;
    }
    button{
      width:100%;
      border:0;
      border-radius:10px;
      padding:14px;
      margin-top:12px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      min-height:48px;
    }
    .primary{background:#287be0;color:white}
    .green{background:#16a66a;color:white}
    .secondary{background:#e8f0fa;color:#174878}
    #scannerBox{display:none;margin-top:16px}
    #reader{
      overflow:hidden;
      border-radius:14px;
      background:#000;
    }
    #status{
      min-height:24px;
      margin-top:12px;
      text-align:center;
      font-weight:700;
    }
    .ok{color:#118859}
    .bad{color:#c73535}
    .hint{
      margin-top:12px;
      color:#6b7f98;
      font-size:13px;
      text-align:center;
    }
    .session{
      margin-bottom:12px;
      padding:12px;
      border-radius:12px;
      background:#eaf7f2;
      color:#11724e;
      text-align:center;
      font-weight:800;
    }
    .manual{
      display:none;
      margin-top:18px;
      border-top:1px solid #e2e8f0;
      padding-top:16px;
    }
    #pairing{display:none}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>SaludStock</h1>
    <p>Escáner móvil de códigos de barras</p>
  </div>

  <div class="card">
    <div id="pairedInfo" class="session" style="display:none">
      ✓ Conectado a SaludStock
    </div>

    <div id="pairing">
      <label for="session">Código de conexión</label>
      <input id="session" inputmode="numeric" maxlength="6" placeholder="Ej. 482193">
    </div>

    <button class="primary" id="connectBtn">Abrir cámara</button>

    <div id="scannerBox">
      <div id="reader"></div>
      <button class="secondary" id="stopBtn">Detener cámara</button>
    </div>

    <div id="status">Conectando con SaludStock...</div>

    <div class="manual" id="manualBox">
      <label for="manualCode">Código manual</label>
      <input id="manualCode" inputmode="numeric" placeholder="Escribe el código">
      <button class="green" id="sendManual">Enviar código</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dhcpgjexxodqwlktuwlg.supabase.co";
const SUPABASE_KEY = "sb_publishable_o6ZOZV8KktcjJei9eApATQ_l_YhyFsX";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const hashText = window.location.hash.replace(/^#/, "");
const hashParams = new URLSearchParams(hashText);

const sessionFromQr = (
  params.get("session") ||
  params.get("s") ||
  hashParams.get("session") ||
  hashParams.get("s") ||
  (/^\d{6}$/.test(hashText) ? hashText : "")
).trim();

const sessionInput = document.getElementById("session");
const pairing = document.getElementById("pairing");
const pairedInfo = document.getElementById("pairedInfo");
const connectBtn = document.getElementById("connectBtn");
const stopBtn = document.getElementById("stopBtn");
const scannerBox = document.getElementById("scannerBox");
const statusEl = document.getElementById("status");
const manualBox = document.getElementById("manualBox");
const manualCode = document.getElementById("manualCode");
const sendManual = document.getElementById("sendManual");

let scanner = null;
let activeSession = sessionFromQr;
let lastCode = "";
let lastSentAt = 0;
let sentCount = 0;
let starting = false;

function status(text, ok=true) {
  statusEl.textContent = text;
  statusEl.className = ok ? "ok" : "bad";
}

function hasValidSession() {
  return /^\d{6}$/.test(activeSession);
}

function setupPairingUi() {
  if (hasValidSession()) {
    pairing.style.display = "none";
    pairedInfo.style.display = "block";
    connectBtn.textContent = "Abrir cámara";
    status("Conectado. Abriendo cámara…", true);
  } else {
    pairing.style.display = "block";
    pairedInfo.style.display = "none";
    status("Escribe el código de respaldo.", false);
  }
}

async function sendBarcode(code) {
  const now = Date.now();
  code = String(code || "").trim();

  if (!code) return;
  if (code === lastCode && now - lastSentAt < 1800) return;

  lastCode = code;
  lastSentAt = now;

  const { data, error } = await client.rpc("submit_barcode", {
    p_session_code: activeSession,
    p_barcode: code
  });

  if (error) {
    status("No se pudo enviar: " + error.message, false);
    return;
  }

  if (!data) {
    status("La conexión venció o fue cerrada en la PC.", false);
    return;
  }

  sentCount += 1;
  if (navigator.vibrate) navigator.vibrate(100);

  status(
    "✓ Producto #" + sentCount + " enviado: " + code +
    ". Escanea el siguiente.",
    true
  );
}

async function startScanner() {
  if (starting || scanner) return;

  if (!activeSession) {
    activeSession = sessionInput.value.trim();
  }

  if (!hasValidSession()) {
    status("El código de conexión debe tener 6 números.", false);
    return;
  }

  setupPairingUi();
  starting = true;
  connectBtn.disabled = true;
  scannerBox.style.display = "block";
  manualBox.style.display = "block";

  const formats = [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF
  ];

  scanner = new Html5Qrcode(
    "reader",
    { formatsToSupport: formats, verbose: false }
  );

  try {
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 300, height: 150 },
        aspectRatio: 1.7778
      },
      decodedText => sendBarcode(decodedText),
      () => {}
    );

    status("Cámara lista. Escanea todos los productos que necesites.", true);
  } catch (err) {
    try { await scanner.clear(); } catch (_) {}
    scanner = null;
    scannerBox.style.display = "none";
    status(
      "No se pudo abrir automáticamente. Pulsa «Abrir cámara» y acepta el permiso.",
      false
    );
  } finally {
    starting = false;
    connectBtn.disabled = false;
  }
}

async function stopScanner() {
  if (scanner) {
    try { await scanner.stop(); } catch (_) {}
    try { await scanner.clear(); } catch (_) {}
  }

  scanner = null;
  scannerBox.style.display = "none";
  connectBtn.disabled = false;

  status(
    "Cámara detenida. La conexión con la PC sigue activa.",
    true
  );
}

connectBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", stopScanner);

sendManual.addEventListener("click", () => {
  sendBarcode(manualCode.value.trim());
  manualCode.value = "";
  manualCode.focus();
});

setupPairingUi();

// Si llegamos desde el QR, intentamos abrir la cámara automáticamente.
// Si el navegador exige un toque, el botón queda disponible como respaldo.
if (hasValidSession()) {
  setTimeout(() => {
    startScanner();
  }, 350);
}
</script>
</body>
</html>
