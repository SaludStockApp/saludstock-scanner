<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SaludStock · Escáner</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#eef4fb;
      color:#12345b;
    }
    .wrap{
      width:min(94%,520px);
      margin:0 auto;
      padding:28px 0 44px;
    }
    .brand{text-align:center;margin-bottom:18px}
    .brand h1{margin:0;font-size:30px;color:#16477c}
    .brand p{margin:5px 0 0;color:#6b7f98}
    .card{
      background:#fff;
      border:1px solid #d3dfec;
      border-radius:18px;
      padding:20px;
      box-shadow:0 10px 28px rgba(36,73,112,.08);
    }
    .state{
      margin-bottom:12px;
      padding:12px;
      border-radius:12px;
      background:#eaf7f2;
      color:#11724e;
      text-align:center;
      font-weight:800;
    }
    button{
      width:100%;
      border:0;
      border-radius:10px;
      padding:14px;
      margin-top:12px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      min-height:48px;
    }
    button:disabled{opacity:.5;cursor:not-allowed}
    .primary{background:#287be0;color:#fff}
    .secondary{background:#e8f0fa;color:#174878}
    #scannerBox{display:none;margin-top:16px}
    #reader{overflow:hidden;border-radius:14px;background:#000}
    #status{
      min-height:24px;
      margin-top:14px;
      text-align:center;
      font-weight:700;
      line-height:1.35;
    }
    .ok{color:#118859}
    .bad{color:#c73535}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>SaludStock</h1>
    <p>Escáner móvil</p>
  </div>

  <div class="card">
    <div id="state" class="state">Conectando...</div>

    <button class="primary" id="connectBtn">Abrir cámara</button>

    <div id="scannerBox">
      <div id="reader"></div>
      <button class="secondary" id="stopBtn">Detener cámara</button>
    </div>

    <div id="status"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dhcpgjexxodqwlktuwlg.supabase.co";
const SUPABASE_KEY = "sb_publishable_o6ZOZV8KktcjJei9eApATQ_l_YhyFsX";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const stateEl = document.getElementById("state");
const connectBtn = document.getElementById("connectBtn");
const stopBtn = document.getElementById("stopBtn");
const scannerBox = document.getElementById("scannerBox");
const statusEl = document.getElementById("status");

// Lee la sesión de cualquier parte razonable de la URL.
// Esto evita que una redirección de GitHub Pages rompa el emparejamiento.
function readSession(){
  const href = String(window.location.href || "");
  const match = href.match(/[?#&](?:s|session)=([0-9]{6})(?:[^0-9]|$)/i);
  if(match) return match[1];

  try{
    const query = new URLSearchParams(window.location.search);
    const q = query.get("s") || query.get("session");
    if(/^\d{6}$/.test(q || "")) return q;
  }catch(_){ }

  try{
    const hash = String(window.location.hash || "").replace(/^#/, "");
    const hp = new URLSearchParams(hash);
    const h = hp.get("s") || hp.get("session");
    if(/^\d{6}$/.test(h || "")) return h;
  }catch(_){ }

  return "";
}

const activeSession = readSession();

let scanner = null;
let starting = false;
let lastCode = "";
let lastSentAt = 0;
let sentCount = 0;

function setStatus(text, ok=true){
  statusEl.textContent = text;
  statusEl.className = ok ? "ok" : "bad";
}

function validSession(){
  return /^\d{6}$/.test(activeSession);
}

function setDisconnected(){
  stateEl.textContent = "○ No conectado";
  connectBtn.disabled = true;
  setStatus("Vuelve a escanear el QR de SaludStock.", false);
}

async function sendBarcode(code){
  code = String(code || "").trim();
  if(!code) return;

  const now = Date.now();
  if(code === lastCode && now - lastSentAt < 1800) return;

  lastCode = code;
  lastSentAt = now;

  const {data,error} = await client.rpc(
    "submit_barcode",
    {
      p_session_code: activeSession,
      p_barcode: code
    }
  );

  if(error){
    setStatus("No se pudo enviar.", false);
    return;
  }

  if(!data){
    setStatus("Conexión finalizada. Vuelve a escanear el QR.", false);
    return;
  }

  sentCount += 1;
  if(navigator.vibrate) navigator.vibrate(100);

  setStatus("✓ " + code, true);
}

async function startScanner(){
  if(!validSession() || starting || scanner) return;

  starting = true;
  connectBtn.disabled = true;
  scannerBox.style.display = "block";

  const formats = [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF
  ];

  scanner = new Html5Qrcode(
    "reader",
    {formatsToSupport: formats, verbose:false}
  );

  try{
    await scanner.start(
      {facingMode:"environment"},
      {
        fps:10,
        qrbox:{width:300,height:150},
        aspectRatio:1.7778
      },
      decodedText => sendBarcode(decodedText),
      () => {}
    );

    stateEl.textContent = "● Conectado";
    setStatus("Listo para escanear", true);

  }catch(_){
    try{ await scanner.clear(); }catch(__){}
    scanner = null;
    scannerBox.style.display = "none";
    connectBtn.disabled = false;
    setStatus("Pulsa «Abrir cámara» y acepta el permiso.", false);

  }finally{
    starting = false;
    if(!scanner) connectBtn.disabled = false;
  }
}

async function stopScanner(){
  if(scanner){
    try{ await scanner.stop(); }catch(_){}
    try{ await scanner.clear(); }catch(_){}
  }

  scanner = null;
  scannerBox.style.display = "none";
  connectBtn.disabled = false;
  setStatus("Cámara detenida", true);
}

connectBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", stopScanner);

if(!validSession()){
  setDisconnected();
}else{
  stateEl.textContent = "● Conectado";
  setStatus("Abriendo cámara...", true);

  // Los navegadores pueden exigir un toque para activar la cámara.
  // Si lo permiten, se abre sola; si no, queda el botón listo.
  setTimeout(() => startScanner(), 300);
}
</script>
</body>
</html>
